<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>News-Briefing — Zugriff erlauben</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f7f6f3; color: #1a1a1a;
    margin: 0; min-height: 100vh; display: grid; place-items: center; }
  .card { background: #fff; border: 1px solid #e5e3dd; border-radius: 14px; padding: 28px 26px;
    width: min(92vw, 380px); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: #555; font-size: 14px; line-height: 1.5; margin: 6px 0 16px; }
  label { font-size: 13px; color: #444; display: block; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 15px;
    border: 1px solid #d5d2ca; border-radius: 9px; margin-bottom: 12px; }
  button { width: 100%; padding: 11px; font-size: 15px; font-weight: 600; border: 0;
    border-radius: 9px; cursor: pointer; }
  .primary { background: #1a1a1a; color: #fff; }
  .ghost { background: transparent; color: #666; margin-top: 8px; }
  .scopes { background: #f4f2ec; border-radius: 9px; padding: 10px 12px; font-size: 13px; color: #333; margin-bottom: 16px; }
  .err { color: #b3261e; font-size: 13px; margin: 8px 0; min-height: 16px; }
  .hidden { display: none; }
  .muted { color: #999; font-size: 12px; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>News-Briefing</h1>

  <div id="login">
    <p>Melde dich an, um <b id="clientNameL">einer App</b> Zugriff auf deine Briefings zu geben.</p>
    <div id="emailStep">
      <label for="email">E-Mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="du@example.com" />
      <button class="primary" id="sendCode">Code anfordern</button>
    </div>
    <div id="codeStep" class="hidden">
      <label for="code">8-stelliger Code aus der E-Mail</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="12345678" />
      <button class="primary" id="verify">Anmelden</button>
      <button class="ghost" id="backToEmail">Andere E-Mail</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="consent" class="hidden">
    <p><b id="clientName">Eine App</b> möchte auf dein News-Briefing zugreifen.</p>
    <div class="scopes" id="scopes"></div>
    <button class="primary" id="approve">Erlauben</button>
    <button class="ghost" id="deny">Ablehnen</button>
    <div class="err" id="consentErr"></div>
    <div class="muted" id="who"></div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://twiqrvxcxerhatmpnyvp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3aXFydnhjeGVyaGF0bXBueXZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTQxMjQsImV4cCI6MjEwMDk3MDEyNH0.ku1K5Pf3Y_ScVnqWihUHKHzdGeogTq52xdqNHrAo2RI";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const authorizationId = params.get("authorization_id");
const $ = (id) => document.getElementById(id);
const show = (id) => $(id).classList.remove("hidden");
const hide = (id) => $(id).classList.add("hidden");

if (!authorizationId) {
  $("login").innerHTML = '<p>Ungültiger Aufruf: <code>authorization_id</code> fehlt.</p>';
}

async function renderConsent() {
  hide("login"); show("consent");
  const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
  if (error) { $("consentErr").textContent = error.message; return; }
  const name = data?.client?.name ?? "Eine App";
  $("clientName").textContent = name;
  const scopes = (data?.scope ?? "").split(" ").filter(Boolean);
  $("scopes").innerHTML = scopes.length
    ? "Berechtigungen:<br>" + scopes.map((s) => "• " + s).join("<br>")
    : "Voller Lesezugriff auf deine News-Briefings.";
  const { data: u } = await supabase.auth.getUser();
  $("who").textContent = u?.user?.email ? "Angemeldet als " + u.user.email : "";
}

async function boot() {
  const { data } = await supabase.auth.getSession();
  if (data?.session) return renderConsent();
  show("login");
}

$("sendCode").onclick = async () => {
  $("loginErr").textContent = "";
  const email = $("email").value.trim();
  if (!email) return;
  const { error } = await supabase.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  if (error) { $("loginErr").textContent = error.message; return; }
  hide("emailStep"); show("codeStep");
};

$("backToEmail").onclick = () => { hide("codeStep"); show("emailStep"); };

$("verify").onclick = async () => {
  $("loginErr").textContent = "";
  const email = $("email").value.trim();
  const token = $("code").value.trim();
  const { error } = await supabase.auth.verifyOtp({ email, token, type: "email" });
  if (error) { $("loginErr").textContent = error.message; return; }
  renderConsent();
};

$("approve").onclick = async () => {
  $("consentErr").textContent = "";
  const { data, error } = await supabase.auth.oauth.approveAuthorization(authorizationId);
  if (error) { $("consentErr").textContent = error.message; return; }
  location.href = data.redirect_url;
};

$("deny").onclick = async () => {
  const { data, error } = await supabase.auth.oauth.denyAuthorization(authorizationId);
  if (error) { $("consentErr").textContent = error.message; return; }
  location.href = data.redirect_url;
};

boot();
</script>
</body>
</html>
