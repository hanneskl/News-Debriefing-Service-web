<title>News-Briefing</title>
<style>
  :root { color-scheme: light; }

  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #555; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <h1>News-Briefing</h1>
    <p>Die Weboberfläche entsteht hier. Bis dahin läuft der Dienst über deine

  </div>
